name: Publish elrico preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'logo/elrico-final.svg'
      - 'assets/elrico-metallic.png'
      - 'assets/elrico-orb-intro.mp4'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Prepare static preview (only public website files)
        run: |
          set -eu
          mkdir -p _site/logo _site/assets
          cp index.html styles.css script.js _site/
          cp logo/elrico-final.svg _site/logo/
          cp assets/elrico-metallic.png assets/elrico-orb-intro.mp4 _site/assets/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
